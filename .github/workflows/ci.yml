name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build + GTest (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMDP_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src ros2 -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  ros2:
    name: ROS 2 Humble build
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Build with colcon
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          apt-get update && apt-get install -y libgtest-dev
          mkdir -p ws/src && cp -r ros2 ws/src/mdp_ros2 && cp -r src ws/src/mdp_ros2/core
          cd ws && colcon build --event-handlers console_direct+
          colcon test --event-handlers console_direct+ && colcon test-result --verbose
